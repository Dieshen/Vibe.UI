name: Publish NuGet Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish; must match the package project versions (e.g., 1.0.0-beta)'
        required: true
        type: string
      dry_run:
        description: 'Validate, pack, and upload artifacts without pushing to NuGet.org'
        required: true
        default: true
        type: boolean

env:
  DOTNET_VERSION: '10.0.x'

permissions:
  contents: read

jobs:
  visual-regression:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.0

    - name: Setup pinned .NET SDK
      uses: actions/setup-dotnet@v5.4.0
      with:
        global-json-file: global.json

    - name: Restore visual test dependencies
      run: |
        dotnet restore samples/Vibe.UI.Docs/Vibe.UI.Docs.csproj
        dotnet restore tests/Vibe.UI.Docs.E2E/Vibe.UI.Docs.E2E.csproj

    - name: Build docs and visual tests
      run: |
        dotnet build samples/Vibe.UI.Docs/Vibe.UI.Docs.csproj --configuration Release --no-restore -p:TreatWarningsAsErrors=true
        dotnet build tests/Vibe.UI.Docs.E2E/Vibe.UI.Docs.E2E.csproj --configuration Release --no-restore -p:TreatWarningsAsErrors=true

    - name: Install Chromium
      run: pwsh tests/Vibe.UI.Docs.E2E/bin/Release/net10.0/playwright.ps1 install chromium

    - name: Compare reviewed visual baselines
      run: |
        $env:BROWSER = 'chromium'
        dotnet test tests/Vibe.UI.Docs.E2E/Vibe.UI.Docs.E2E.csproj --configuration Release --no-build --verbosity normal --filter Category=Visual -- RunConfiguration.TestSessionTimeout=900000

    - name: Upload visual regression artifacts
      if: failure()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: release-visual-regression-windows-chromium
        path: |
          output/playwright/visual-regression/**
          Artifacts/**
        if-no-files-found: ignore
        retention-days: 14

  publish:
    needs: visual-regression
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      dry_run: ${{ steps.release.outputs.dry_run }}
      production_ref_allowed: ${{ steps.release.outputs.production_ref_allowed }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.0
      with:
        fetch-depth: 0

    - name: Setup pinned .NET SDK
      uses: actions/setup-dotnet@v5.4.0
      with:
        global-json-file: global.json

    - name: Setup Node.js
      uses: actions/setup-node@v6.4.0
      with:
        node-version: '26'
        cache: npm
        cache-dependency-path: |
          src/Vibe.UI/ts-src/package-lock.json
          samples/Vibe.UI.Docs/ts-src/package-lock.json

    - name: Validate release parameters
      id: release
      env:
        EVENT_NAME: ${{ github.event_name }}
        INPUT_DRY_RUN: ${{ inputs.dry_run }}
        INPUT_VERSION: ${{ inputs.version }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        SOURCE_REF: ${{ github.ref }}
      run: |
        set -euo pipefail

        if [[ "$EVENT_NAME" == "release" ]]; then
          RAW_VERSION="$RELEASE_TAG"
          DRY_RUN="true"
        elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
          RAW_VERSION="$INPUT_VERSION"
          DRY_RUN="$INPUT_DRY_RUN"
        else
          echo "::error::Unsupported publish event '${EVENT_NAME}'"
          exit 1
        fi

        VERSION="${RAW_VERSION#v}"
        if [[ ! "$VERSION" =~ ^1\.0\.0-beta(\.[0-9]+)?$ ]]; then
          echo "::error::Beta publish version must match ^1\\.0\\.0-beta(\\.[0-9]+)?$"
          exit 1
        fi

        if [[ "$DRY_RUN" != "true" && "$DRY_RUN" != "false" ]]; then
          echo "::error::Dry-run input must be true or false, got '${DRY_RUN}'"
          exit 1
        fi

        if [[ "$DRY_RUN" == "false" && "$EVENT_NAME" != "workflow_dispatch" ]]; then
          echo "::error::Production publishing requires a manual workflow dispatch"
          exit 1
        fi

        PRODUCTION_REF_ALLOWED="false"
        if [[ "$SOURCE_REF" == "refs/heads/main" ]]; then
          PRODUCTION_REF_ALLOWED="true"
        elif [[ "$SOURCE_REF" =~ ^refs/tags/v?1\.0\.0-beta(\.[0-9]+)?$ ]]; then
          TAG_VERSION="${SOURCE_REF#refs/tags/}"
          TAG_VERSION="${TAG_VERSION#v}"
          if [[ "$TAG_VERSION" == "$VERSION" ]]; then
            PRODUCTION_REF_ALLOWED="true"
          fi
        fi

        if [[ "$EVENT_NAME" == "release" && "$SOURCE_REF" != "refs/tags/${RELEASE_TAG}" ]]; then
          echo "::error::Release ref '${SOURCE_REF}' does not match release tag '${RELEASE_TAG}'"
          exit 1
        fi

        if [[ "$DRY_RUN" == "false" && "$PRODUCTION_REF_ALLOWED" != "true" ]]; then
          echo "::error::Production publishing is allowed only from main or a matching beta tag; got '${SOURCE_REF}'"
          exit 1
        fi

        for project in \
          src/Vibe.UI.CSS/Vibe.UI.CSS.csproj \
          src/Vibe.UI/Vibe.UI.csproj \
          src/Vibe.UI.CLI/Vibe.UI.CLI.csproj
        do
          PROJECT_VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$project" | head -n 1)"
          if [ "$PROJECT_VERSION" != "$VERSION" ]; then
            echo "::error::${project} version '${PROJECT_VERSION}' does not match publish version '${VERSION}'"
            exit 1
          fi
        done

        printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
        printf 'dry_run=%s\n' "$DRY_RUN" >> "$GITHUB_OUTPUT"
        printf 'production_ref_allowed=%s\n' "$PRODUCTION_REF_ALLOWED" >> "$GITHUB_OUTPUT"
        echo "Validated package version ${VERSION}; dry run: ${DRY_RUN}."

    - name: Validate Vibe.UI TypeScript
      working-directory: src/Vibe.UI/ts-src
      run: |
        npm ci
        npm test
        npm run deploy

    - name: Validate docs TypeScript
      working-directory: samples/Vibe.UI.Docs/ts-src
      run: |
        npm ci
        npm test
        npm run deploy

    - name: Verify generated JavaScript is committed
      run: git diff --exit-code -- src/Vibe.UI/wwwroot/js/vibe-chart.js samples/Vibe.UI.Docs/wwwroot/js/chart.umd.js samples/Vibe.UI.Docs/wwwroot/js/shiki-interop.js samples/Vibe.UI.Docs/wwwroot/js/docs.js

    - name: Restore Vibe.UI.CSS
      run: dotnet restore src/Vibe.UI.CSS/Vibe.UI.CSS.csproj

    - name: Restore Vibe.UI
      run: dotnet restore src/Vibe.UI/Vibe.UI.csproj

    - name: Restore Vibe.UI.CLI
      run: dotnet restore src/Vibe.UI.CLI/Vibe.UI.CLI.csproj

    - name: Restore docs app
      run: dotnet restore samples/Vibe.UI.Docs/Vibe.UI.Docs.csproj

    - name: Restore compatibility test fixtures
      run: |
        dotnet restore samples/Vibe.UI.Compatibility.StandaloneClient/Vibe.UI.Compatibility.StandaloneClient.csproj
        dotnet restore samples/Vibe.UI.Compatibility.WebApp/Vibe.UI.Compatibility.WebApp/Vibe.UI.Compatibility.WebApp.csproj
        dotnet restore tests/Vibe.UI.Docs.E2E/Vibe.UI.Docs.E2E.csproj

    - name: Build Vibe.UI.CSS
      run: dotnet build src/Vibe.UI.CSS/Vibe.UI.CSS.csproj --configuration Release --no-restore -p:TreatWarningsAsErrors=true

    - name: Build Vibe.UI
      run: dotnet build src/Vibe.UI/Vibe.UI.csproj --configuration Release --no-restore -p:TreatWarningsAsErrors=true

    - name: Build Vibe.UI.CLI
      run: dotnet build src/Vibe.UI.CLI/Vibe.UI.CLI.csproj --configuration Release --no-restore -p:TreatWarningsAsErrors=true

    - name: Build docs app
      run: dotnet build samples/Vibe.UI.Docs/Vibe.UI.Docs.csproj --configuration Release --no-restore -p:TreatWarningsAsErrors=true

    - name: Build compatibility test fixtures
      run: |
        dotnet build samples/Vibe.UI.Compatibility.StandaloneClient/Vibe.UI.Compatibility.StandaloneClient.csproj --configuration Release --no-restore -p:TreatWarningsAsErrors=true
        dotnet build samples/Vibe.UI.Compatibility.WebApp/Vibe.UI.Compatibility.WebApp/Vibe.UI.Compatibility.WebApp.csproj --configuration Release --no-restore -p:TreatWarningsAsErrors=true
        dotnet build tests/Vibe.UI.Docs.E2E/Vibe.UI.Docs.E2E.csproj --configuration Release --no-restore -p:TreatWarningsAsErrors=true

    - name: Validate CSS beta core profile
      uses: ./.github/actions/validate-css-core-profile

    - name: Restore unit tests
      run: |
        dotnet restore tests/Vibe.UI.CSS.Tests/Vibe.UI.CSS.Tests.csproj
        dotnet restore tests/Vibe.UI.Tests/Vibe.UI.Tests.csproj
        dotnet restore tests/Vibe.UI.CLI.Tests/Vibe.UI.CLI.Tests.csproj

    - name: Run tests
      run: |
        dotnet test tests/Vibe.UI.CSS.Tests/Vibe.UI.CSS.Tests.csproj --configuration Release --no-restore --verbosity normal -p:TreatWarningsAsErrors=true
        dotnet test tests/Vibe.UI.Tests/Vibe.UI.Tests.csproj --configuration Release --no-restore --verbosity normal -p:TreatWarningsAsErrors=true
        dotnet test tests/Vibe.UI.CLI.Tests/Vibe.UI.CLI.Tests.csproj --configuration Release --no-restore --verbosity normal -p:TreatWarningsAsErrors=true

    - name: Install Playwright browsers
      run: pwsh tests/Vibe.UI.Docs.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium firefox webkit

    - name: Run docs integration browser tests
      run: BROWSER=chromium dotnet test tests/Vibe.UI.Docs.E2E/Vibe.UI.Docs.E2E.csproj --configuration Release --no-build --verbosity normal --filter Category=Integration -- RunConfiguration.TestSessionTimeout=300000

    - name: Run docs smoke browser tests
      run: BROWSER=chromium dotnet test tests/Vibe.UI.Docs.E2E/Vibe.UI.Docs.E2E.csproj --configuration Release --no-build --verbosity normal --filter Category=Smoke -- RunConfiguration.TestSessionTimeout=600000

    - name: Run docs functional browser tests
      run: BROWSER=chromium dotnet test tests/Vibe.UI.Docs.E2E/Vibe.UI.Docs.E2E.csproj --configuration Release --no-build --verbosity normal --filter Category=Functional -- RunConfiguration.TestSessionTimeout=1200000

    - name: Run compatibility browser tests
      run: |
        for browser in chromium firefox webkit; do
          echo "Running compatibility browser tests with ${browser}"
          BROWSER="${browser}" dotnet test tests/Vibe.UI.Docs.E2E/Vibe.UI.Docs.E2E.csproj --configuration Release --no-build --verbosity normal --filter Category=Compatibility -- RunConfiguration.TestSessionTimeout=600000
        done

    - name: Pack Vibe.UI.CSS
      env:
        PACKAGE_VERSION: ${{ steps.release.outputs.version }}
      run: |
        dotnet pack src/Vibe.UI.CSS/Vibe.UI.CSS.csproj --configuration Release --no-build --output ./packages /p:Version="$PACKAGE_VERSION" /p:PackageVersion="$PACKAGE_VERSION"

    - name: Pack Vibe.UI
      env:
        PACKAGE_VERSION: ${{ steps.release.outputs.version }}
      run: |
        dotnet pack src/Vibe.UI/Vibe.UI.csproj --configuration Release --no-build --output ./packages /p:Version="$PACKAGE_VERSION" /p:PackageVersion="$PACKAGE_VERSION"

    - name: Pack Vibe.UI.CLI
      env:
        PACKAGE_VERSION: ${{ steps.release.outputs.version }}
      run: |
        dotnet pack src/Vibe.UI.CLI/Vibe.UI.CLI.csproj --configuration Release --no-build --output ./packages /p:Version="$PACKAGE_VERSION" /p:PackageVersion="$PACKAGE_VERSION"

    - name: List packages
      run: ls -lh ./packages/

    - name: Configure candidate package source mapping
      shell: pwsh
      run: |
        $localSource = [System.Security.SecurityElement]::Escape((Resolve-Path ./packages).Path)
        $globalPackages = [System.Security.SecurityElement]::Escape(
          (Join-Path $env:RUNNER_TEMP "vibe-candidate-packages"))
        $configPath = Join-Path $env:RUNNER_TEMP "vibe-candidate-nuget.config"
        Set-Content -LiteralPath $configPath -Encoding utf8NoBOM -Value @"
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <config>
            <add key="globalPackagesFolder" value="$globalPackages" />
          </config>
          <packageSources>
            <clear />
            <add key="candidate" value="$localSource" />
            <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
          </packageSources>
          <packageSourceMapping>
            <clear />
            <packageSource key="candidate">
              <package pattern="Vibe.UI" />
              <package pattern="Vibe.UI.*" />
            </packageSource>
            <packageSource key="nuget.org">
              <package pattern="*" />
            </packageSource>
          </packageSourceMapping>
        </configuration>
        "@

    - name: Validate local packages
      env:
        PACKAGE_VERSION: ${{ steps.release.outputs.version }}
      run: pwsh scripts/Validate-LocalPackages.ps1 -PackagesPath ./packages -Version "$PACKAGE_VERSION"

    - name: Rebuild compatibility fixtures from local packages
      env:
        PACKAGE_VERSION: ${{ steps.release.outputs.version }}
      run: |
        dotnet restore samples/Vibe.UI.Compatibility.StandaloneClient/Vibe.UI.Compatibility.StandaloneClient.csproj --configfile "$RUNNER_TEMP/vibe-candidate-nuget.config" -p:VibeUsePackageReferences=true -p:VibePackageVersion="$PACKAGE_VERSION"
        dotnet restore samples/Vibe.UI.Compatibility.WebApp/Vibe.UI.Compatibility.WebApp/Vibe.UI.Compatibility.WebApp.csproj --configfile "$RUNNER_TEMP/vibe-candidate-nuget.config" -p:VibeUsePackageReferences=true -p:VibePackageVersion="$PACKAGE_VERSION"
        dotnet build samples/Vibe.UI.Compatibility.StandaloneClient/Vibe.UI.Compatibility.StandaloneClient.csproj --configuration Release --no-restore -p:TreatWarningsAsErrors=true -p:VibeUsePackageReferences=true -p:VibePackageVersion="$PACKAGE_VERSION"
        dotnet build samples/Vibe.UI.Compatibility.WebApp/Vibe.UI.Compatibility.WebApp/Vibe.UI.Compatibility.WebApp.csproj --configuration Release --no-restore -p:TreatWarningsAsErrors=true -p:VibeUsePackageReferences=true -p:VibePackageVersion="$PACKAGE_VERSION"

    - name: Run package compatibility browser tests
      run: |
        for browser in chromium firefox webkit; do
          echo "Running package compatibility browser tests with ${browser}"
          BROWSER="${browser}" dotnet test tests/Vibe.UI.Docs.E2E/Vibe.UI.Docs.E2E.csproj --configuration Release --no-build --verbosity normal --filter Category=Compatibility -- RunConfiguration.TestSessionTimeout=600000
        done

    - name: Dry run complete
      if: steps.release.outputs.dry_run == 'true'
      run: echo "Dry run completed. Packages were validated and will be uploaded as artifacts, but not pushed to NuGet.org."

    - name: Upload packages as artifacts
      uses: actions/upload-artifact@v7.0.1
      with:
        name: nuget-packages
        path: ./packages/*.nupkg
        retention-days: 90

  promote:
    name: Promote packages to NuGet.org
    needs: publish
    if: ${{ github.event_name == 'workflow_dispatch' && needs.publish.outputs.dry_run == 'false' && needs.publish.outputs.production_ref_allowed == 'true' }}
    runs-on: ubuntu-latest
    concurrency: nuget-production
    environment:
      name: nuget-production

    steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v5.4.0
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Download validated packages
      uses: actions/download-artifact@v7.0.0
      with:
        name: nuget-packages
        path: ./packages

    - name: Push validated packages to NuGet.org
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        PACKAGE_VERSION: ${{ needs.publish.outputs.version }}
      run: |
        set -euo pipefail

        if [[ ! "$PACKAGE_VERSION" =~ ^1\.0\.0-beta(\.[0-9]+)?$ ]]; then
          echo "::error::Refusing to publish an invalid beta version"
          exit 1
        fi

        if [[ -z "$NUGET_API_KEY" ]]; then
          echo "::error::NUGET_API_KEY is required in the nuget-production environment"
          exit 1
        fi

        for package in \
          "./packages/Vibe.UI.CSS.${PACKAGE_VERSION}.nupkg" \
          "./packages/Vibe.UI.${PACKAGE_VERSION}.nupkg" \
          "./packages/Vibe.UI.CLI.${PACKAGE_VERSION}.nupkg"
        do
          if [[ ! -f "$package" ]]; then
            echo "::error::Validated package artifact is missing: '${package}'"
            exit 1
          fi
          dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        done
