name: Publish NuGet Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish; must match the package project versions (e.g., 1.0.0-beta)'
        required: true
        type: string
      dry_run:
        description: 'Validate, pack, and upload artifacts without pushing to NuGet.org'
        required: true
        default: true
        type: boolean

env:
  DOTNET_VERSION: '9.0.x'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: |
          src/Vibe.UI/ts-src/package-lock.json
          samples/Vibe.UI.Docs/ts-src/package-lock.json

    - name: Determine version
      id: version
      run: |
        if [ "${{ github.event_name }}" == "release" ]; then
          VERSION="${{ github.event.release.tag_name }}"
          # Remove 'v' prefix if present
          VERSION="${VERSION#v}"
        else
          VERSION="${{ inputs.version }}"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Publishing version: $VERSION"

    - name: Determine publish mode
      id: publish_mode
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          DRY_RUN="${{ inputs.dry_run }}"
        else
          DRY_RUN="false"
        fi

        echo "dry_run=$DRY_RUN" >> $GITHUB_OUTPUT
        echo "Dry run: $DRY_RUN"

    - name: Validate beta version
      run: |
        set -euo pipefail
        VERSION="${{ steps.version.outputs.version }}"

        case "$VERSION" in
          1.0.0-beta|1.0.0-beta.[0-9]*) ;;
          *)
            echo "::error::Beta publish version must be 1.0.0-beta or 1.0.0-beta.N, got '${VERSION}'"
            exit 1
            ;;
        esac

        for project in \
          src/Vibe.UI.CSS/Vibe.UI.CSS.csproj \
          src/Vibe.UI/Vibe.UI.csproj \
          src/Vibe.UI.CLI/Vibe.UI.CLI.csproj
        do
          PROJECT_VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$project" | head -n 1)"
          if [ "$PROJECT_VERSION" != "$VERSION" ]; then
            echo "::error::${project} version '${PROJECT_VERSION}' does not match publish version '${VERSION}'"
            exit 1
          fi
        done

    - name: Validate Vibe.UI TypeScript
      working-directory: src/Vibe.UI/ts-src
      run: |
        npm ci
        npm test
        npm run deploy

    - name: Validate docs TypeScript
      working-directory: samples/Vibe.UI.Docs/ts-src
      run: |
        npm ci
        npm test
        npm run deploy

    - name: Verify generated JavaScript is committed
      run: git diff --exit-code -- src/Vibe.UI/wwwroot/js/vibe-chart.js samples/Vibe.UI.Docs/wwwroot/js/chart.umd.js samples/Vibe.UI.Docs/wwwroot/js/shiki-interop.js samples/Vibe.UI.Docs/wwwroot/js/docs.js

    - name: Restore Vibe.UI.CSS
      run: dotnet restore src/Vibe.UI.CSS/Vibe.UI.CSS.csproj

    - name: Restore Vibe.UI
      run: dotnet restore src/Vibe.UI/Vibe.UI.csproj

    - name: Restore Vibe.UI.CLI
      run: dotnet restore src/Vibe.UI.CLI/Vibe.UI.CLI.csproj

    - name: Restore compatibility test fixtures
      run: |
        dotnet restore samples/Vibe.UI.Compatibility.StandaloneClient/Vibe.UI.Compatibility.StandaloneClient.csproj
        dotnet restore samples/Vibe.UI.Compatibility.WebApp/Vibe.UI.Compatibility.WebApp/Vibe.UI.Compatibility.WebApp.csproj
        dotnet restore tests/Vibe.UI.Docs.E2E/Vibe.UI.Docs.E2E.csproj

    - name: Build Vibe.UI.CSS
      run: dotnet build src/Vibe.UI.CSS/Vibe.UI.CSS.csproj --configuration Release --no-restore -p:TreatWarningsAsErrors=true

    - name: Build Vibe.UI
      run: dotnet build src/Vibe.UI/Vibe.UI.csproj --configuration Release --no-restore -p:TreatWarningsAsErrors=true

    - name: Build Vibe.UI.CLI
      run: dotnet build src/Vibe.UI.CLI/Vibe.UI.CLI.csproj --configuration Release --no-restore -p:TreatWarningsAsErrors=true

    - name: Build compatibility test fixtures
      run: |
        dotnet build samples/Vibe.UI.Compatibility.StandaloneClient/Vibe.UI.Compatibility.StandaloneClient.csproj --configuration Release --no-restore -p:TreatWarningsAsErrors=true
        dotnet build samples/Vibe.UI.Compatibility.WebApp/Vibe.UI.Compatibility.WebApp/Vibe.UI.Compatibility.WebApp.csproj --configuration Release --no-restore -p:TreatWarningsAsErrors=true
        dotnet build tests/Vibe.UI.Docs.E2E/Vibe.UI.Docs.E2E.csproj --configuration Release --no-restore -p:TreatWarningsAsErrors=true

    - name: Restore unit tests
      run: |
        dotnet restore tests/Vibe.UI.CSS.Tests/Vibe.UI.CSS.Tests.csproj
        dotnet restore tests/Vibe.UI.Tests/Vibe.UI.Tests.csproj
        dotnet restore tests/Vibe.UI.CLI.Tests/Vibe.UI.CLI.Tests.csproj

    - name: Run tests
      run: |
        dotnet test tests/Vibe.UI.CSS.Tests/Vibe.UI.CSS.Tests.csproj --configuration Release --no-restore --verbosity normal -p:TreatWarningsAsErrors=true
        dotnet test tests/Vibe.UI.Tests/Vibe.UI.Tests.csproj --configuration Release --no-restore --verbosity normal -p:TreatWarningsAsErrors=true
        dotnet test tests/Vibe.UI.CLI.Tests/Vibe.UI.CLI.Tests.csproj --configuration Release --no-restore --verbosity normal -p:TreatWarningsAsErrors=true

    - name: Install Playwright browsers
      run: pwsh tests/Vibe.UI.Docs.E2E/bin/Release/net9.0/playwright.ps1 install --with-deps chromium firefox webkit

    - name: Run docs integration browser tests
      run: BROWSER=chromium dotnet test tests/Vibe.UI.Docs.E2E/Vibe.UI.Docs.E2E.csproj --configuration Release --no-build --verbosity normal --filter Category=Integration -- RunConfiguration.TestSessionTimeout=300000

    - name: Run docs smoke browser tests
      run: BROWSER=chromium dotnet test tests/Vibe.UI.Docs.E2E/Vibe.UI.Docs.E2E.csproj --configuration Release --no-build --verbosity normal --filter Category=Smoke -- RunConfiguration.TestSessionTimeout=600000

    - name: Run compatibility browser tests
      run: |
        for browser in chromium firefox webkit; do
          echo "Running compatibility browser tests with ${browser}"
          BROWSER="${browser}" dotnet test tests/Vibe.UI.Docs.E2E/Vibe.UI.Docs.E2E.csproj --configuration Release --no-build --verbosity normal --filter Category=Compatibility -- RunConfiguration.TestSessionTimeout=180000
        done

    - name: Pack Vibe.UI.CSS
      run: |
        dotnet pack src/Vibe.UI.CSS/Vibe.UI.CSS.csproj --configuration Release --no-build --output ./packages /p:Version=${{ steps.version.outputs.version }} /p:PackageVersion=${{ steps.version.outputs.version }}

    - name: Pack Vibe.UI
      run: |
        dotnet pack src/Vibe.UI/Vibe.UI.csproj --configuration Release --no-build --output ./packages /p:Version=${{ steps.version.outputs.version }} /p:PackageVersion=${{ steps.version.outputs.version }}

    - name: Pack Vibe.UI.CLI
      run: |
        dotnet pack src/Vibe.UI.CLI/Vibe.UI.CLI.csproj --configuration Release --no-build --output ./packages /p:Version=${{ steps.version.outputs.version }} /p:PackageVersion=${{ steps.version.outputs.version }}

    - name: List packages
      run: ls -lh ./packages/

    - name: Validate local packages
      run: pwsh scripts/Validate-LocalPackages.ps1 -PackagesPath ./packages -Version "${{ steps.version.outputs.version }}"

    - name: Rebuild compatibility fixtures from local packages
      run: |
        dotnet restore samples/Vibe.UI.Compatibility.StandaloneClient/Vibe.UI.Compatibility.StandaloneClient.csproj --source ./packages --source https://api.nuget.org/v3/index.json -p:VibeUsePackageReferences=true -p:VibePackageVersion="${{ steps.version.outputs.version }}"
        dotnet restore samples/Vibe.UI.Compatibility.WebApp/Vibe.UI.Compatibility.WebApp/Vibe.UI.Compatibility.WebApp.csproj --source ./packages --source https://api.nuget.org/v3/index.json -p:VibeUsePackageReferences=true -p:VibePackageVersion="${{ steps.version.outputs.version }}"
        dotnet build samples/Vibe.UI.Compatibility.StandaloneClient/Vibe.UI.Compatibility.StandaloneClient.csproj --configuration Release --no-restore -p:TreatWarningsAsErrors=true -p:VibeUsePackageReferences=true -p:VibePackageVersion="${{ steps.version.outputs.version }}"
        dotnet build samples/Vibe.UI.Compatibility.WebApp/Vibe.UI.Compatibility.WebApp/Vibe.UI.Compatibility.WebApp.csproj --configuration Release --no-restore -p:TreatWarningsAsErrors=true -p:VibeUsePackageReferences=true -p:VibePackageVersion="${{ steps.version.outputs.version }}"

    - name: Run package compatibility browser tests
      run: |
        for browser in chromium firefox webkit; do
          echo "Running package compatibility browser tests with ${browser}"
          BROWSER="${browser}" dotnet test tests/Vibe.UI.Docs.E2E/Vibe.UI.Docs.E2E.csproj --configuration Release --no-build --verbosity normal --filter Category=Compatibility -- RunConfiguration.TestSessionTimeout=180000
        done

    - name: Validate NuGet API key
      if: steps.publish_mode.outputs.dry_run != 'true'
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        if [ -z "${NUGET_API_KEY}" ]; then
          echo "::error::NUGET_API_KEY secret is required for non-dry-run publishing"
          exit 1
        fi

    - name: Dry run complete
      if: steps.publish_mode.outputs.dry_run == 'true'
      run: echo "Dry run completed. Packages were validated and will be uploaded as artifacts, but not pushed to NuGet.org."

    - name: Push to NuGet.org
      if: steps.publish_mode.outputs.dry_run != 'true'
      run: |
        dotnet nuget push ./packages/Vibe.UI.CSS.${{ steps.version.outputs.version }}.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        dotnet nuget push ./packages/Vibe.UI.${{ steps.version.outputs.version }}.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        dotnet nuget push ./packages/Vibe.UI.CLI.${{ steps.version.outputs.version }}.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Upload packages as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ./packages/*.nupkg
        retention-days: 90
